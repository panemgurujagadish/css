<html>

<head>
    <title> background color picker </title>
    <script>
        function changeBg(color) {
            document.getElementById("box").style.background = color;

        }




    </script>


</head>

<body>

    <div id="box"> selectcolor</div>
    <input type="color" onchange="changeBg(this.value)">

</body>



</html>
