<html>

<head>
    <title> method 5 html </title>

    <script>
        function toggleMenu() {
            document.getElementById("menu").classList.toggle("hide");


        }

    </script>
    <style>
        .hide {

            display: none;
        }
    </style>



</head>

<body>

    <div id="menu">home <br>about <br> conact</div>
    <button onclick="toggleMenu()">Toggle Menu</button>

    </button>


</body>


</html>
