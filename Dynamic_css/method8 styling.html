<html>

<head>
    <script>
        function validate() {
            let email = document.getElementById("email");
            if (email.value === "") {
                email.style.border = "2px solid red ";
            }

        }



    </script>


</head>

<body>
    <input id="email">
    <button onclick="validate()">check</button>




</body>


</html>
