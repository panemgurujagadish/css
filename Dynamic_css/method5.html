<html>

<head>
    <title>method 4 html</title>
    <script>
        function removetheme() {
            document.getElementById("card").classList.remove("dark-theme");

        }

        

    </script>
    <style>
        .card {

            color: violet;
            background-color: rgb(141, 141, 44);


        }


    </style>


</head>

<body>

    <div class="card"> welcome</div>
    <button onclick=" removetheme()">remove theme</button>
</body>

</html>
