<html>

<head>
    <title>method 4 html</title>
    <script>
        function applytheme() {
            document.getElementById("card").classList.add("dark-theme")
            
        }

    </script>
    <style>
        .dark-theme {
            background-color: palevioletred;
            color: red;
            padding: 20px;
        }
    </style>


</head>

<body>

    <div id="card"> welcome</div>
    <button onclick=" applytheme()">apply theme</button>
</body>

</html>
