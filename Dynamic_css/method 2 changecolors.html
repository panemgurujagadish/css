<html>

<head>
    <title>method 2 change colurs</title>

    <script>
        function changecolors() {

            let box = document.getElementById("box");
            box.style.backgroundColor = "orange";
            box.style.color = "white";
            box.style.fontSize = "205px";
            box.style.borderRadius = "10px"




        }
    </script>
    <style>
        #box {
            background-color: aqua;
            color: bisque;
        }
    </style>


</head>

<body>

    <p id="box">Jagish</p>
    <button onclick="changecolors()">change the theme</button>







</body>



</html>
