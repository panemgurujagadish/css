<html>

<head>
    <title> dark mode toggle </title>

    <script>
        function darkmode() {
            document.body.classList.toggle("dark");


        }


    </script>
    <style>
        .dark {
            background-color: blue;
            color: wheat;


        }
    </style>



</head>

<body>

    <button onclick="darkmode()">darkmode</button>





</body>


</html>
