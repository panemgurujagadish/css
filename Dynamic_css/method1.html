<html>

<head>
    <title>Method 1</title>
    <style>
        #box {
            width: 200px;
            padding: 20px;
            background: lightblue;
        }
    </style>
    <script>
        function changeColor() {
            document.getElementById("box").style.backgroundColor = "green";
        }
    </script>
</head>

<body>

    <button onclick="changeColor()">Change Color</button>
    <div id="box">
        Dynamic CSS Example
    </div>
</body>

</html>
